name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: check, test and package
    runs-on: windows-latest

    steps:
      - name: Checkout (with daemon submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            sudokooler -> sudokooler/target

      - name: Install NSH 0.5
        shell: pwsh
        run: |
          $env:NSH_VERSION = 'v0.5.0'
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Headless app tests
        run: nsh test

      - name: Daemon tests
        run: cargo test --manifest-path sudokooler/Cargo.toml

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build portable release and setup
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\build-release.ps1

      - name: Upload setup executable
        uses: actions/upload-artifact@v4
        with:
          name: sudocooler-setup
          path: dist/sudocooler-setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: sudocooler-portable
          path: dist/sudocooler-portable.zip
          if-no-files-found: error
          retention-days: 7
