[package]
name = "sudocooler"
version = "0.1.6"
edition = "2024"
description = "Native app for Sudokoo CPU coolers, built with NSH"
license = "GPL-3.0"
publish = false

# Keep the submodule daemon out of this crate's workspace.
[workspace]
exclude = ["sudokooler"]

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
env_logger = "0.11"
hidapi = "2"
nsh-updater = "0.5.0"
ureq = "2"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false, features = ["shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
nsh-engine = "0.5.0"
nsh-testing = "0.5.0"
